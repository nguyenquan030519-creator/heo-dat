<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500">
<!-- ĐẠI GIA – ông trùm hút xì gà (bên phải, quay mặt vào giữa) -->
<style>
.k{stroke:#1a1410;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
.puff{animation:up 4.2s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}
.p2{animation-delay:1.4s}.p3{animation-delay:2.8s}
@keyframes up{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:.95}100%{transform:translate(-26px,-170px) scale(1.5);opacity:0}}
.ember{animation:glow 1.1s ease-in-out infinite alternate}
@keyframes glow{from{fill:#ff5a1f}to{fill:#ffd000}}
.brow{animation:brow 3.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes brow{0%,80%,100%{transform:none}88%{transform:translateY(-7px) rotate(-6deg)}}
</style>
<g class="k" fill="#eef1f4" style="stroke-width:4">
  <g class="puff"><circle cx="40" cy="282" r="20"/><text x="40" y="291" font-family="Arial Black,Arial" font-weight="900" font-size="24" text-anchor="middle" fill="#1f9e5b" stroke="none">$</text></g>
  <g class="puff p2"><circle cx="40" cy="282" r="16"/><text x="40" y="290" font-family="Arial Black,Arial" font-weight="900" font-size="20" text-anchor="middle" fill="#e0a400" stroke="none">₫</text></g>
  <g class="puff p3"><circle cx="40" cy="282" r="18"/><text x="40" y="290" font-family="Arial Black,Arial" font-weight="900" font-size="22" text-anchor="middle" fill="#1f9e5b" stroke="none">$</text></g>
</g>
<!-- vest -->
<path class="k" fill="#22223a" d="M8 500 C14 420 70 372 150 366 C230 372 286 420 292 500 Z"/>
<path class="k" fill="#fff" d="M118 368 L150 446 L182 368 Z"/>
<path class="k" fill="#e0a400" d="M141 380 h18 l6 58 l-15 18 l-15 -18 Z"/>
<path class="k" fill="#34345a" d="M112 370 L150 452 L102 424 L90 386 Z"/>
<path class="k" fill="#34345a" d="M188 370 L150 452 L198 424 L210 386 Z"/>
<path class="k" fill="#ff4d6d" d="M222 430 l26 -8 l-4 24 Z" style="stroke-width:4"/>
<circle cx="96" cy="452" r="9" fill="#ffcc33" class="k" style="stroke-width:4"/>
<!-- cổ, tai, đầu -->
<rect class="k" fill="#f0bf94" x="126" y="318" width="48" height="56" rx="12"/>
<circle class="k" fill="#f0bf94" cx="74" cy="262" r="15"/>
<circle class="k" fill="#f0bf94" cx="226" cy="262" r="15"/>
<ellipse class="k" fill="#f6cba2" cx="150" cy="255" rx="78" ry="86"/>
<path class="k" fill="none" d="M120 332 Q150 350 180 332" style="stroke-width:4"/>
<!-- tóc bóng mượt -->
<path class="k" fill="#1a1410" d="M72 240 C62 158 238 150 228 240 C214 200 170 186 122 196 C98 202 82 218 72 240 Z"/>
<path d="M112 184 C140 174 182 176 208 192" stroke="#fff" stroke-width="5" fill="none" opacity=".55" stroke-linecap="round"/>
<!-- lông mày (nhướn) -->
<path class="k" d="M96 228 L140 222" style="stroke-width:9"/>
<path class="k brow" d="M160 220 L206 230" style="stroke-width:9"/>
<!-- kính râm viền vàng -->
<rect x="90" y="236" width="56" height="36" rx="14" fill="#14141f" stroke="#e0a400" stroke-width="6"/>
<rect x="156" y="236" width="56" height="36" rx="14" fill="#14141f" stroke="#e0a400" stroke-width="6"/>
<path d="M146 250 Q151 244 156 250" stroke="#e0a400" stroke-width="5" fill="none"/>
<path d="M100 248 l16 -5 M166 248 l16 -5" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<!-- mũi, má, ria -->
<path class="k" fill="#eab088" d="M150 266 C140 290 138 302 152 302 C162 302 164 296 160 290" style="stroke-width:5"/>
<ellipse cx="104" cy="294" rx="14" ry="8" fill="#ff8a7a" opacity=".55"/>
<ellipse cx="198" cy="294" rx="14" ry="8" fill="#ff8a7a" opacity=".55"/>
<path class="k" fill="#1a1410" d="M98 314 C110 296 140 300 150 308 C160 300 190 296 202 314 C186 322 166 318 150 312 C134 318 114 322 98 314 Z"/>
<path class="k" fill="none" d="M156 328 Q176 332 188 322" style="stroke-width:5"/>
<rect x="168" y="326" width="9" height="7" fill="#ffcc33" stroke="#1a1410" stroke-width="2"/>
<!-- xì gà -->
<g transform="rotate(12 122 322)">
  <rect class="k" fill="#8b5a2b" x="36" y="312" width="90" height="20" rx="9"/>
  <rect fill="#e0a400" x="100" y="312" width="12" height="20" stroke="#1a1410" stroke-width="4"/>
  <rect class="k" fill="#b9b9b9" x="36" y="312" width="14" height="20" rx="7" style="stroke-width:4"/>
  <circle class="ember" cx="35" cy="322" r="6"/>
</g>
</svg>
