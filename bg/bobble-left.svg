<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500">
<!-- BOBBLE SẾP – Sếp Bobble đầu lò xo, vung tiền (bên trái) -->
<style>
.k{stroke:#2a0f45;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
.head{animation:bob 1.8s ease-in-out infinite;transform-origin:150px 330px}
@keyframes bob{0%,100%{transform:rotate(0)}12%{transform:rotate(10deg) translateY(-4px)}26%{transform:rotate(-8deg)}40%{transform:rotate(6deg) translateY(-2px)}55%{transform:rotate(-4deg)}70%{transform:rotate(2deg)}85%{transform:rotate(-1deg)}}
.arm{animation:throw 1.2s ease-in-out infinite;transform-origin:188px 372px}
@keyframes throw{0%,100%{transform:rotate(30deg)}45%{transform:rotate(-55deg)}55%{transform:rotate(-60deg)}}
.cash{animation:cash 1.2s ease-out infinite;opacity:0}
.c2{animation-delay:.15s}.c3{animation-delay:.3s}.c4{animation-delay:.6s}
@keyframes cash{0%,40%{transform:translate(0,0) rotate(0);opacity:0}48%{opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
</style>
<!-- tiền bay -->
<g>
  <g class="cash" style="--x:80px;--y:-120px;--r:200deg"><rect x="226" y="290" width="40" height="22" rx="3" fill="#2fbf71" stroke="#2a0f45" stroke-width="3"/><circle cx="246" cy="301" r="6" fill="#bff0d6"/></g>
  <g class="cash c2" style="--x:40px;--y:-170px;--r:-160deg"><rect x="226" y="290" width="40" height="22" rx="3" fill="#2fbf71" stroke="#2a0f45" stroke-width="3"/><circle cx="246" cy="301" r="6" fill="#bff0d6"/></g>
  <g class="cash c3" style="--x:100px;--y:-60px;--r:300deg"><rect x="226" y="290" width="40" height="22" rx="3" fill="#ff8fab" stroke="#2a0f45" stroke-width="3"/><circle cx="246" cy="301" r="6" fill="#ffe0e9"/></g>
  <g class="cash c4" style="--x:-10px;--y:-150px;--r:120deg"><rect x="226" y="290" width="40" height="22" rx="3" fill="#2fbf71" stroke="#2a0f45" stroke-width="3"/><circle cx="246" cy="301" r="6" fill="#bff0d6"/></g>
</g>
<!-- bệ -->
<rect class="k" fill="#ffcc33" x="62" y="448" width="176" height="44" rx="10"/>
<ellipse class="k" fill="#ffe27a" cx="150" cy="448" rx="88" ry="14"/>
<text x="150" y="482" font-family="Arial Black,Arial" font-weight="900" font-size="22" text-anchor="middle" fill="#2a0f45">SẾP</text>
<!-- thân -->
<path class="k" fill="#2b2d6e" d="M104 450 C102 384 122 350 150 350 C178 350 198 384 196 450 Z"/>
<path class="k" fill="#fff" d="M136 352 L150 392 L164 352 Z" style="stroke-width:4"/>
<path class="k" fill="#e63946" d="M145 360 h10 l4 40 l-9 10 l-9 -10 Z" style="stroke-width:3"/>
<path class="k" fill="#2b2d6e" d="M112 380 C96 398 94 420 104 436" style="stroke-width:16"/>
<path d="M112 380 C96 398 94 420 104 436" stroke="#2b2d6e" stroke-width="6" fill="none" stroke-linecap="round"/>
<circle class="k" fill="#f6cba2" cx="106" cy="440" r="11" style="stroke-width:4"/>
<!-- tay vung tiền -->
<g class="arm">
  <path class="k" d="M188 372 L232 318" style="stroke-width:18"/>
  <path d="M188 372 L232 318" stroke="#2b2d6e" stroke-width="8" stroke-linecap="round"/>
  <circle class="k" fill="#f6cba2" cx="236" cy="312" r="13" style="stroke-width:4"/>
  <rect x="228" y="290" width="36" height="20" rx="3" fill="#2fbf71" stroke="#2a0f45" stroke-width="3" transform="rotate(-20 246 300)"/>
</g>
<!-- cổ lò xo -->
<path d="M150 352 l-10 -5 l20 -5 l-20 -5 l20 -5 l-10 -5" stroke="#9aa0a6" stroke-width="5" fill="none" stroke-linejoin="round"/>
<!-- đầu to -->
<g class="head">
  <circle class="k" fill="#f6cba2" cx="40" cy="214" r="20"/>
  <circle class="k" fill="#f6cba2" cx="260" cy="214" r="20"/>
  <ellipse class="k" fill="#f9d3ae" cx="150" cy="210" rx="114" ry="112"/>
  <path class="k" fill="#3b2314" d="M38 196 C30 100 270 92 262 196 C250 150 210 128 170 140 C150 118 100 116 76 150 C60 164 46 178 38 196 Z"/>
  <path d="M168 140 C160 126 150 120 140 118" stroke="#fff" stroke-width="4" opacity=".4" fill="none" stroke-linecap="round"/>
  <path class="k" d="M88 176 Q112 160 136 172 M164 172 Q188 160 212 176" style="stroke-width:8"/>
  <circle cx="114" cy="210" r="28" fill="#fff" fill-opacity=".5" stroke="#2a0f45" stroke-width="6"/>
  <circle cx="186" cy="210" r="28" fill="#fff" fill-opacity=".5" stroke="#2a0f45" stroke-width="6"/>
  <path d="M142 210 h16" stroke="#2a0f45" stroke-width="6"/>
  <circle fill="#2a0f45" cx="118" cy="212" r="8"/><circle fill="#2a0f45" cx="182" cy="212" r="8"/>
  <circle cx="115" cy="208" r="3" fill="#fff"/><circle cx="179" cy="208" r="3" fill="#fff"/>
  <ellipse cx="80" cy="256" rx="18" ry="10" fill="#ff8a7a" opacity=".55"/><ellipse cx="220" cy="256" rx="18" ry="10" fill="#ff8a7a" opacity=".55"/>
  <path class="k" fill="#7a1f2b" d="M96 258 Q150 320 204 258 Z"/>
  <path fill="#fff" d="M104 262 L196 262 L190 274 L110 274 Z"/>
  <rect x="168" y="262" width="12" height="11" fill="#ffcc33" stroke="#2a0f45" stroke-width="2"/>
  <ellipse cx="150" cy="300" rx="22" ry="9" fill="#ff7a8a"/>
</g>
</svg>
