<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500">
<!-- HALLOWEEN – Bí ngô đội mũ phù thuỷ cười gian, dơi bay (bên phải) -->
<style>
.k{stroke:#14101c;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
.bat{animation:bat 4s ease-in-out infinite}
.bt2{animation-delay:-2s;animation-duration:5s}
@keyframes bat{0%,100%{transform:translate(0,0)}25%{transform:translate(-30px,-20px)}50%{transform:translate(10px,-40px)}75%{transform:translate(30px,-10px)}}
.wing{animation:wing .22s ease-in-out infinite alternate;transform-box:fill-box}
@keyframes wing{to{transform:scaleY(.4)}}
.glow{animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{from{fill:#ffcf3f}to{fill:#ff8a00}}
.bob{animation:bob 2.8s ease-in-out infinite;transform-origin:150px 480px}
@keyframes bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
</style>
<g class="bat"><g transform="translate(70 110)"><path class="wing" fill="#14101c" d="M0 0 C-14 -14 -30 -10 -38 -2 C-30 -4 -24 2 -22 8 C-16 2 -8 4 0 8 C8 4 16 2 22 8 C24 2 30 -4 38 -2 C30 -10 14 -14 0 0 Z"/><circle cx="-3" cy="2" r="1.8" fill="#ffcf3f"/><circle cx="3" cy="2" r="1.8" fill="#ffcf3f"/></g></g>
<g class="bat bt2"><g transform="translate(220 70) scale(.8)"><path class="wing" fill="#14101c" d="M0 0 C-14 -14 -30 -10 -38 -2 C-30 -4 -24 2 -22 8 C-16 2 -8 4 0 8 C8 4 16 2 22 8 C24 2 30 -4 38 -2 C30 -10 14 -14 0 0 Z"/></g></g>
<g class="bob">
  <path class="k" fill="#5a3d1e" d="M140 258 C138 236 146 222 162 214 L168 226 C158 232 154 244 156 258 Z"/>
  <ellipse class="k" fill="#ff8a1a" cx="150" cy="370" rx="122" ry="108"/>
  <path d="M150 264 C110 300 110 440 150 476 M150 264 C190 300 190 440 150 476 M86 290 C60 340 64 420 96 462 M214 290 C240 340 236 420 204 462" stroke="#14101c" stroke-width="4" fill="none" opacity=".45"/>
  <path class="glow" stroke="#14101c" stroke-width="4" d="M90 340 L126 318 L130 352 Z"/>
  <path class="glow" stroke="#14101c" stroke-width="4" d="M210 340 L174 318 L170 352 Z"/>
  <path class="glow" stroke="#14101c" stroke-width="4" d="M84 396 Q150 470 216 396 L196 404 L186 390 L172 410 L158 394 L150 414 L142 394 L128 410 L114 390 L104 404 Z"/>
  <!-- mũ phù thuỷ -->
  <path class="k" fill="#3b2a5a" d="M64 268 Q150 300 236 268 Q150 250 64 268 Z"/>
  <path class="k" fill="#3b2a5a" d="M100 268 C112 210 120 150 186 96 C172 140 186 200 200 268 Z"/>
  <path d="M104 252 Q150 264 198 252" stroke="#a678ff" stroke-width="12" fill="none"/>
  <rect x="140" y="244" width="18" height="16" rx="3" fill="#ffcf3f" stroke="#14101c" stroke-width="3"/>
</g>
</svg>
