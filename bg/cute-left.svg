<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500">
<!-- CUTE – Thỏ Mochi ôm đồng xu (bên trái) -->
<style>
.k{stroke:#5a2a45;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
.earR{animation:ear 2.8s ease-in-out infinite;transform-origin:196px 222px}
@keyframes ear{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(14deg)}90%{transform:rotate(-4deg)}}
.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.hf{animation:hf 3.4s ease-in infinite;transform-box:fill-box;transform-origin:center;opacity:0}
.h2{animation-delay:1.1s}.h3{animation-delay:2.2s}
@keyframes hf{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-120px) scale(1.1);opacity:0}}
</style>
<g fill="#ff6fa8" stroke="#5a2a45" stroke-width="3">
  <path class="hf" transform="translate(40 230) scale(1.6)" d="M0 6 C-12 -6 -6 -16 0 -8 C6 -16 12 -6 0 6 Z"/>
  <path class="hf h2" transform="translate(262 260) scale(1.3)" d="M0 6 C-12 -6 -6 -16 0 -8 C6 -16 12 -6 0 6 Z"/>
  <path class="hf h3" transform="translate(70 170) scale(1.1)" d="M0 6 C-12 -6 -6 -16 0 -8 C6 -16 12 -6 0 6 Z"/>
</g>
<!-- tai -->
<g transform="rotate(-12 108 150)"><ellipse class="k" fill="#fff" cx="108" cy="150" rx="28" ry="82"/><ellipse fill="#ffc2da" cx="108" cy="156" rx="13" ry="58"/></g>
<g class="earR"><g transform="rotate(14 192 150)"><ellipse class="k" fill="#fff" cx="192" cy="150" rx="28" ry="82"/><ellipse fill="#ffc2da" cx="192" cy="156" rx="13" ry="58"/></g>
  <!-- kẹp dâu tây -->
  <path class="k" fill="#ff4d6d" d="M214 96 C200 96 196 116 214 132 C232 116 228 96 214 96 Z" style="stroke-width:4"/>
  <path fill="#5cc97a" stroke="#5a2a45" stroke-width="3" d="M204 96 L214 88 L224 96 L214 100 Z"/>
  <circle cx="209" cy="108" r="1.8" fill="#fff4b0"/><circle cx="219" cy="110" r="1.8" fill="#fff4b0"/><circle cx="214" cy="120" r="1.8" fill="#fff4b0"/>
</g>
<!-- thân & đầu -->
<ellipse class="k" fill="#fff" cx="150" cy="424" rx="96" ry="76"/>
<ellipse class="k" fill="#fff" cx="110" cy="490" rx="32" ry="14"/>
<ellipse class="k" fill="#fff" cx="190" cy="490" rx="32" ry="14"/>
<ellipse class="k" fill="#fff" cx="150" cy="288" rx="102" ry="84"/>
<!-- mặt -->
<g class="blink"><ellipse fill="#3a1f2e" cx="112" cy="288" rx="11" ry="14"/><ellipse fill="#3a1f2e" cx="188" cy="288" rx="11" ry="14"/></g>
<circle cx="108" cy="282" r="4" fill="#fff"/><circle cx="184" cy="282" r="4" fill="#fff"/>
<ellipse cx="88" cy="318" rx="18" ry="10" fill="#ffb3cf"/>
<ellipse cx="212" cy="318" rx="18" ry="10" fill="#ffb3cf"/>
<path fill="#ff8fb8" stroke="#5a2a45" stroke-width="3" d="M143 304 L157 304 L150 312 Z"/>
<path class="k" fill="none" d="M136 320 Q143 330 150 320 Q157 330 164 320" style="stroke-width:4"/>
<!-- đồng xu -->
<circle class="k" fill="#ffd36e" cx="150" cy="420" r="44"/>
<circle fill="none" stroke="#5a2a45" stroke-width="3" stroke-opacity=".35" cx="150" cy="420" r="32"/>
<text x="150" y="436" font-family="Arial Black,Arial" font-weight="900" font-size="44" text-anchor="middle" fill="#5a2a45">₫</text>
<ellipse class="k" fill="#fff" cx="104" cy="418" rx="20" ry="16"/>
<ellipse class="k" fill="#fff" cx="196" cy="418" rx="20" ry="16"/>
</svg>
