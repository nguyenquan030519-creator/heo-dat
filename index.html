<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div id="banner" hidden><button id="banner-btn">🔒 Bấm vào đây để mở sổ chi tiêu</button></div>

<header class="top">
  <div class="coin-logo">₫</div>
  <div class="brand"><h1>Heo Đất</h1><div class="cycle" id="h-cycle"></div></div>
  <button class="pill" id="h-store"></button>
</header>

<main class="wrap">
  <section id="screen-today"></section>
  <section id="screen-month" hidden></section>
  <section id="screen-plan" hidden></section>
  <section id="screen-settings" hidden></section>
</main>

<button id="fab" aria-label="Ghi khoản mới">+</button>
<div id="overlay" class="overlay"></div>
<div id="sheet" class="sheet" role="dialog" aria-label="Ghi khoản mới"></div>

<nav id="nav"><div class="bar">
  <button data-tab="today" class="on"><span>🐷</span>Hôm nay</button>
  <button data-tab="month"><span>🧾</span>Tháng này</button>
  <button data-tab="plan"><span>🎯</span>Tiết kiệm</button>
  <button data-tab="settings"><span>⚙️</span>Cài đặt</button>
</div></nav>

<div id="fx-layer" class="fx-layer"></div>
<div id="toast"></div>

<!-- Thứ tự quan trọng: lõi trước, tính năng sau, app.js cuối cùng -->

<script src="js/theme-motion.js"></script>
<script src="js/themes.js"></script>
<script src="js/theme-preview.js"></script>
<script src="js/app.js"></script>
</body>
</html>
